name: Validate and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python and cache build dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-lock.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/etag.py check
      - name: Verify committed Cardputer binaries and source freshness
        run: python tools/cardputer_release.py verify
      - run: python -m unittest discover -s tests -v
      - run: pio test -e native
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.14.0'
      - name: Test display protocols, persistence, and browser uploads
        run: python tools/test_display.py

  esp32:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: [cardputer-adv, esp32-devkit, esp32-s3-devkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python and cache build dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-lock.txt
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ runner.arch }}-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'config/platformio/*.ini', '.python-version', 'requirements-*.txt') }}
      - run: pio run -e ${{ matrix.environment }}
      - name: Package Cardputer factory and Launcher images
        if: matrix.environment == 'cardputer-adv'
        run: pio run -e cardputer-adv -t package
      - name: Upload complete Cardputer installation files
        if: matrix.environment == 'cardputer-adv'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cardputer-adv-flashable
          if-no-files-found: error
          include-hidden-files: true
          path: .pio/build/cardputer-adv/release/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: programmer-${{ matrix.environment }}
          if-no-files-found: error
          # PlatformIO outputs live under the hidden .pio directory.
          include-hidden-files: true
          path: |
            .pio/build/${{ matrix.environment }}/firmware.bin
            .pio/build/${{ matrix.environment }}/firmware.elf

  cc2510:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python and cache build dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-lock.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: pio run -d firmware/targets/cc2510
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cc2510f32-smoke-compile-only
          if-no-files-found: error
          include-hidden-files: true
          path: |
            firmware/targets/cc2510/.pio/build/cc2510f32-smoke/firmware.hex
            firmware/targets/cc2510/.pio/build/cc2510f32-smoke/firmware.map
