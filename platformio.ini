[platformio]
default_envs = cardputer-adv
src_dir = firmware/programmer/src
include_dir = firmware/programmer/include
test_dir = test
extra_configs =
    config/platformio/hosts.ini
    config/platformio/tests.ini
    config/platformio/local.ini

[env]
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_type = release
lib_ldf_mode = chain+
extra_scripts = pre:tools/pio_prepare.py
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[esp32]
platform = platformio/espressif32@6.12.0
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
upload_speed = 460800
build_src_flags = -Wall -Wextra -Werror
